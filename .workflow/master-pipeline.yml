version: '1.0'
name: master-pipeline
displayName: GBB 数据同步
stages:
  - stage:
    name: sync-data
    displayName: 同步彩票数据
    steps:
      - step: build@general
        name: sync_lottery
        displayName: Node 同步
        commands:
          - node -v
          - node scripts/sync-data.mjs
          - git config user.name "gitee-actions"
          - git config user.email "gitee-actions@users.noreply.gitee.com"
          - git add caches/
          - git diff --staged --quiet && echo "无新数据" && exit 0
          - git commit -m "chore: 自动同步彩票数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          - git push https://oauth2:${GITEE_TOKEN}@gitee.com/liar7254/gbb.git HEAD:master
triggers:
  push:
    branches:
      include:
        - master